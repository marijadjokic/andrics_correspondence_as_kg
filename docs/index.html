<script>"use strict";

// Leaves a trace of any script error on <body>, for checking a build.
window.addEventListener("error", (e) => { document.body.dataset.error = e.message; });

// ---------------------------------------------------------------------
// Data and indexes
//
// The page carries only its settings, the research queries and a saved copy
// of the graph. Letters, entities and answers are read from the graph each
// time the page is opened (see 05_graph.js).
// ---------------------------------------------------------------------
const BOOT = JSON.parse(document.getElementById("app-data").textContent);
const config = BOOT.config;
let letters = [];
let entities = {};
let questions = [];
let meta = {};

const TYPES = {
  PER: { one: "Person", many: "People" },
  LOC: { one: "Place", many: "Places" },
  ORG: { one: "Organisation", many: "Organisations" },
  MISC: { one: "Work or other", many: "Works & other" },
  DATE: { one: "Date", many: "Dates" },
};
const ENTITY_TYPES = ["PER", "LOC", "ORG", "MISC"];
const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const ROMAN = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI", "XII"];

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// Case- and diacritic-insensitive form with the same length as the input,
// so a match position in the folded text is also valid in the original.
function fold(s) {
  let out = "";
  for (let i = 0; i < s.length; i++) {
    const d = s[i].normalize("NFD");
    const c = d.length > 1 && /[\u0300-\u036f]/.test(d[1]) ? d[0] : s[i];
    out += (c === "đ" || c === "Đ" ? "d" : c.toLowerCase()[0]);
  }
  return out;
}

let letterById = new Map();
let liveEntities = [];
let mainSender = null;
let YEAR_MIN = 0;
let YEAR_MAX = 0;
const entityOptions = new Map();

// Derive everything the views need from the letters and entities just read from the graph.
function indexModel() {
  letterById = new Map(letters.map((l) => [l.id, l]));
  for (const [key, e] of Object.entries(entities)) {
    Object.assign(e, { key, letters: [], mentions: 0, forms: new Map(), sent: [], received: [], written: [], folded: fold(e.label) });
  }
  letters.forEach((l, i) => {
    l.index = i;
    l.year = l.date ? Number(l.date.slice(0, 4)) : null;
    l.keys = new Set();
    for (const m of l.mentions) {
      const e = entities[m.e];
      if (!e) continue;
      m.text = l.text.slice(m.s, m.t);
      e.mentions++;
      e.forms.set(m.text, (e.forms.get(m.text) || 0) + 1);
      if (!l.keys.has(m.e)) { l.keys.add(m.e); e.letters.push(l); }
    }
    entities[l.sender]?.sent.push(l);
    entities[l.recipient]?.received.push(l);
    entities[l.place]?.written.push(l);
    l.flat = l.text.replace(/\s+/g, " ").trim();
    l.folded = fold(l.flat);
    l.haystack = l.folded + " " + fold([l.sender, l.recipient, l.place].map((k) => entities[k]?.label || "").join(" ")) + " " + l.date;
  });
  liveEntities = Object.values(entities).filter((e) => e.type !== "DATE");
  mainSender = liveEntities.filter((e) => e.sent.length).sort((a, b) => b.sent.length - a.sent.length)[0] || null;
  const years = letters.map((l) => l.year).filter(Boolean);
  YEAR_MIN = years.length ? Math.min(...years) : new Date().getFullYear();
  YEAR_MAX = years.length ? Math.max(...years) : YEAR_MIN;
  entityOptions.clear();
  for (const e of liveEntities) entityOptions.set(`${e.label} · ${TYPES[e.type].one}`, e.key);
}

const label = (key) => entities[key]?.label || "";
const hrefL = (id) => `#/letter/${encodeURIComponent(id)}`;
const hrefE = (key) => `#/entity/${encodeURIComponent(key)}`;
const plural = (n, one, many) => `${n} ${n === 1 ? one : many || one + "s"}`;
const dotOf = (type) => `<span class="dot t-${type}${type === "MISC" ? " di" : ""}"></span>`;

function fmtDate(iso, short) {
  if (!iso) return "Undated";
  const [y, m, d] = iso.split("-").map(Number);
  return `${d} ${short ? MONTHS[m - 1].slice(0, 3) : MONTHS[m - 1]} ${y}`;
}

function entityChip(key, extra = "") {
  const e = entities[key];
  if (!e) return "";
  return `<a class="chip" href="${hrefE(key)}">${dotOf(e.type)}${esc(e.label)}${extra}</a>`;
}

// How many letters an entity is involved in (mentioned, addressed, written from).
function involvement(e) {
  return new Set([...e.letters, ...e.received, ...e.written].map((l) => l.id)).size;
}

function postmark(l, size = 84) {
  const place = label(l.place).toUpperCase();
  const [y, m, d] = l.date ? l.date.split("-").map(Number) : [];
  const tilt = ((l.index * 37) % 13) - 6;
  const id = `pm-${l.id}`;
  return `<svg class="postmark" style="--tilt:${tilt}deg" width="${size}" height="${size}" viewBox="0 0 100 100" role="img" aria-label="${esc(place)} ${esc(fmtDate(l.date))}">
    <defs><path id="${id}" d="M 15 50 A 35 35 0 0 1 85 50"/></defs>
    <circle cx="50" cy="50" r="47" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="50" cy="50" r="27" fill="none" stroke="currentColor" stroke-width="1"/>
    <text font-size="${place.length > 9 ? 9 : 10.5}" letter-spacing="1.4"><textPath href="#${id}" startOffset="50%" text-anchor="middle">${esc(place || "· · ·")}</textPath></text>
    <text x="50" y="49" text-anchor="middle" font-size="13" font-weight="500">${d ? `${d} ${ROMAN[m - 1]}` : "s. d."}</text>
    <text x="50" y="63" text-anchor="middle" font-size="12">${y || ""}</text>
    <text x="50" y="89" text-anchor="middle" font-size="8" letter-spacing="3">✶ ✶ ✶</text>
  </svg>`;
}

// Text excerpt; when a query is given, centred on its first match and highlighted.
function snippet(l, query, length = 190) {
  const q = query ? fold(query.trim()) : "";
  const at = q ? l.folded.indexOf(q) : -1;
  if (at < 0) return esc(l.flat.slice(0, length)) + (l.flat.length > length ? "…" : "");
  const from = Math.max(0, at - Math.floor(length / 3));
  const to = Math.min(l.flat.length, from + length);
  return (from > 0 ? "…" : "") + esc(l.flat.slice(from, at)) + `<mark>${esc(l.flat.slice(at, at + q.length))}</mark>`
    + esc(l.flat.slice(at + q.length, to)) + (to < l.flat.length ? "…" : "");
}

function typeTally(l) {
  const counts = {};
  for (const key of l.keys) {
    const t = entities[key].type;
    if (t !== "DATE") counts[t] = (counts[t] || 0) + 1;
  }
  return ENTITY_TYPES.filter((t) => counts[t])
    .map((t) => `<span>${dotOf(t)}${counts[t]} ${(counts[t] === 1 ? TYPES[t].one : TYPES[t].many).toLowerCase()}</span>`).join("");
}

function download(filename, text, mime) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: mime }));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const csvCell = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;

// ---------------------------------------------------------------------
// Tooltip
// ---------------------------------------------------------------------
const tipEl = document.getElementById("tip");
const tip = {
  show(html, evt) {
    tipEl.innerHTML = html;
    tipEl.hidden = false;
    const r = tipEl.getBoundingClientRect();
    const x = Math.min(evt.clientX + 14, window.innerWidth - r.width - 10);
    const y = evt.clientY + 18 + r.height > window.innerHeight ? evt.clientY - r.height - 12 : evt.clientY + 18;
    tipEl.style.left = `${Math.max(8, x)}px`;
    tipEl.style.top = `${Math.max(8, y)}px`;
  },
  hide() { tipEl.hidden = true; },
};

// ---------------------------------------------------------------------
// Filters shared by the letters, timeline, map and network views
// ---------------------------------------------------------------------
const filters = { q: "", recipient: "", place: "", entities: [], y0: null, y1: null };

function matches(l) {
  if (filters.recipient && l.recipient !== filters.recipient) return false;
  if (filters.place && l.place !== filters.place) return false;
  if (filters.y0 != null && (l.year == null || l.year < filters.y0)) return false;
  if (filters.y1 != null && (l.year == null || l.year > filters.y1)) return false;
  for (const key of filters.entities) {
    if (!l.keys.has(key) && l.recipient !== key && l.sender !== key && l.place !== key) return false;
  }
  if (filters.q.trim() && !l.haystack.includes(fold(filters.q.trim()))) return false;
  return true;
}
const filtered = () => letters.filter(matches);

function resetFilters() {
  Object.assign(filters, { q: "", recipient: "", place: "", entities: [], y0: null, y1: null });
}

function filterBarHtml() {
  const byCount = (list) => (key) => list.filter((l) => l[key]).reduce((m, l) => m.set(l[key], (m.get(l[key]) || 0) + 1), new Map());
  const options = (counts) => [...counts].sort((a, b) => label(a[0]).localeCompare(label(b[0])))
    .map(([key, n]) => `<option value="${esc(key)}">${esc(label(key))} (${n})</option>`).join("");
  const yearOptions = (first) => `<option value="">${first}</option>` + Array.from({ length: YEAR_MAX - YEAR_MIN + 1 }, (_, i) => `<option>${YEAR_MIN + i}</option>`).join("");
  return `
    <div class="filters card">
      <input class="grow" id="f-q" type="search" placeholder="Search in the letter texts…" aria-label="Search in the letter texts">
      <select id="f-recipient" aria-label="Correspondent"><option value="">All correspondents</option>${options(byCount(letters)("recipient"))}</select>
      <select id="f-place" aria-label="Place of writing"><option value="">Written anywhere</option>${options(byCount(letters)("place"))}</select>
      <input id="f-entity" list="f-entity-list" placeholder="Mentions a person, place…" aria-label="Mentions a person, place or organisation">
      <datalist id="f-entity-list">${[...entityOptions.keys()].sort().map((v) => `<option value="${esc(v)}">`).join("")}</datalist>
      <span class="years"><select id="f-y0" aria-label="From year">${yearOptions("From " + YEAR_MIN)}</select>–<select id="f-y1" aria-label="To year">${yearOptions("to " + YEAR_MAX)}</select></span>
    </div>
    <div class="filter-status" id="f-status"></div>`;
}

// Wire the filter bar inside `root`; `onChange(list)` receives the filtered letters.
function bindFilterBar(root, onChange, actionsHtml = "") {
  const $ = (id) => root.querySelector("#" + id);
  const sync = () => {
    $("f-q").value = filters.q;
    $("f-recipient").value = filters.recipient;
    $("f-place").value = filters.place;
    $("f-y0").value = filters.y0 ?? "";
    $("f-y1").value = filters.y1 ?? "";
  };
  const update = () => {
    const list = filtered();
    const chips = [];
    const chip = (text, name, value = "") => chips.push(`<button class="chip" data-clear="${name}" data-value="${esc(value)}">${text}</button>`);
    if (filters.q.trim()) chip(`“${esc(filters.q.trim())}”`, "q");
    if (filters.recipient) chip(`to ${esc(label(filters.recipient))}`, "recipient");
    if (filters.place) chip(`from ${esc(label(filters.place))}`, "place");
    for (const key of filters.entities) chip(`${dotOf(entities[key].type)}${esc(label(key))}`, "entity", key);
    if (filters.y0 != null || filters.y1 != null) chip(`${filters.y0 ?? YEAR_MIN}–${filters.y1 ?? YEAR_MAX}`, "years");
    $("f-status").innerHTML = `<span class="count">${list.length} of ${plural(letters.length, "letter")}</span>${chips.join("")}`
      + (chips.length > 1 ? '<button class="btn small" data-clear="all">Clear all</button>' : "")
      + `<span class="spacer"></span>${actionsHtml}`;
    onChange(list);
  };
  $("f-q").addEventListener("input", (e) => { filters.q = e.target.value; update(); });
  $("f-recipient").addEventListener("change", (e) => { filters.recipient = e.target.value; update(); });
  $("f-place").addEventListener("change", (e) => { filters.place = e.target.value; update(); });
  $("f-y0").addEventListener("change", (e) => { filters.y0 = e.target.value ? Number(e.target.value) : null; update(); });
  $("f-y1").addEventListener("change", (e) => { filters.y1 = e.target.value ? Number(e.target.value) : null; update(); });
  const pickEntity = (e) => {
    const key = entityOptions.get(e.target.value);
    if (!key) return;
    if (!filters.entities.includes(key)) filters.entities.push(key);
    e.target.value = "";
    update();
  };
  $("f-entity").addEventListener("change", pickEntity);
  $("f-entity").addEventListener("input", pickEntity);
  $("f-status").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-clear]");
    if (!btn) return;
    const name = btn.dataset.clear;
    if (name === "all") resetFilters();
    else if (name === "entity") filters.entities = filters.entities.filter((k) => k !== btn.dataset.value);
    else if (name === "years") { filters.y0 = null; filters.y1 = null; }
    else filters[name] = "";
    sync();
    update();
  });
  sync();
  update();
}

// ---------------------------------------------------------------------
// The graph: read the Turtle file when the page opens, keep it in an RDF
// store in the browser, and derive the letters, the entities and the answers
// to the research questions from it with SPARQL.
// ---------------------------------------------------------------------
const OXIGRAPH_URL = "https://cdn.jsdelivr.net/npm/oxigraph@0.5.11/web.js";
const NAMESPACES = [
  ["letter", config.base_uri + "letter/"], ["entity", config.base_uri + "entity/"], ["andric", config.base_uri],
  ["schema", "https://schema.org/"], ["dcterms", "http://purl.org/dc/terms/"], ["prov", "http://www.w3.org/ns/prov#"],
  ["skos", "http://www.w3.org/2004/02/skos/core#"], ["rdfs", "http://www.w3.org/2000/01/rdf-schema#"],
  ["rdf", "http://www.w3.org/1999/02/22-rdf-syntax-ns#"], ["xsd", "http://www.w3.org/2001/XMLSchema#"],
];
const MODEL_PREFIXES = `PREFIX ex: <${config.base_uri}>
PREFIX schema: <https://schema.org/>
PREFIX dcterms: <http://purl.org/dc/terms/>
PREFIX prov: <http://www.w3.org/ns/prov#>
PREFIX skos: <http://www.w3.org/2004/02/skos/core#>
PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
`;

let OX = null;        // the Oxigraph module
let store = null;     // the graph currently on screen
let graphText = "";   // its Turtle source, for download

const localName = (iri) => iri.replace(/\/$/, "").split("/").pop();
const valueOf = (binding) => (binding ? binding.value : "");

function select(sparql) {
  const result = JSON.parse(store.query(sparql, { results_format: "application/sparql-results+json" }));
  return { vars: result.head.vars, rows: result.results.bindings };
}

// Try each configured source in turn; fall back to the copy saved with the page.
async function readGraph() {
  const openedAsFile = location.protocol === "file:";
  const onThisComputer = openedAsFile || ["localhost", "127.0.0.1", "[::1]"].includes(location.hostname);
  if (!openedAsFile) {
    for (const source of config.graph_sources || []) {
      // On this computer only the local file counts: the published graph may be older.
      if (onThisComputer && /^https?:\/\//.test(source)) continue;
      try {
        const response = await fetch(source, { cache: "no-store" });
        if (!response.ok) continue;
        const text = await response.text();
        const candidate = new OX.Store();
        candidate.load(text, { format: "text/turtle" });
        if (!candidate.size) continue;
        const read = new Date().toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
        return { store: candidate, text, origin: { live: true, url: new URL(source, location.href).href, read } };
      } catch (_) { /* unreachable or not valid Turtle: try the next source */ }
    }
  }
  const saved = new OX.Store();
  saved.load(BOOT.snapshot.ttl, { format: "text/turtle" });
  return {
    store: saved, text: BOOT.snapshot.ttl,
    origin: { live: false, built: BOOT.snapshot.built, reason: openedAsFile ? "file" : "unreachable" },
  };
}

function buildModel() {
  entities = {};
  for (const r of select(MODEL_PREFIXES + `SELECT ?e ?label ?type ?wd WHERE {
      ?e dcterms:type ?type ; rdfs:label ?label .
      FILTER NOT EXISTS { ?e a ex:EntityMention }
      OPTIONAL { ?e skos:exactMatch ?wd }
    }`).rows) {
    const key = localName(r.e.value);
    if (!entities[key]) entities[key] = { label: r.label.value, type: r.type.value, wd: valueOf(r.wd) };
  }

  const byUri = new Map();
  const keyOf = (binding) => (binding ? localName(binding.value) : "");
  for (const r of select(MODEL_PREFIXES + `SELECT ?l ?id ?date ?text ?sender ?recipient ?place ?source ?pages WHERE {
      ?l a ex:Letter .
      OPTIONAL { ?l dcterms:identifier ?id }
      OPTIONAL { ?l schema:dateSent ?date }
      OPTIONAL { ?l schema:text ?text }
      OPTIONAL { ?l schema:sender ?sender }
      OPTIONAL { ?l schema:recipient ?recipient }
      OPTIONAL { ?l schema:locationCreated ?place }
      OPTIONAL { ?l prov:hadPrimarySource ?source }
      OPTIONAL { ?l schema:pagination ?pages }
    }`).rows) {
    if (byUri.has(r.l.value)) continue;
    byUri.set(r.l.value, {
      id: valueOf(r.id) || localName(r.l.value), uri: r.l.value, date: valueOf(r.date), text: valueOf(r.text),
      sender: keyOf(r.sender), recipient: keyOf(r.recipient), place: keyOf(r.place),
      source: valueOf(r.source), pages: valueOf(r.pages), mentions: [],
    });
  }
  for (const r of select(MODEL_PREFIXES + `SELECT ?l ?e ?s ?t ?c ?m WHERE {
      ?l ex:hasMention ?x .
      ?x ex:mentionOf ?e ; ex:startOffset ?s ; ex:endOffset ?t .
      OPTIONAL { ?x ex:confidence ?c }
      OPTIONAL { ?x prov:wasGeneratedBy ?m }
    }`).rows) {
    const l = byUri.get(r.l.value);
    if (!l) continue;
    l.mentions.push({
      e: localName(r.e.value), s: Number(r.s.value), t: Number(r.t.value),
      c: r.c ? Math.round(Number(r.c.value) * 1000) / 1000 : null, m: valueOf(r.m),
    });
  }
  letters = [...byUri.values()];
  for (const l of letters) l.mentions.sort((a, b) => a.s - b.s || b.t - a.t);
  letters.sort((a, b) => (a.date || "9999").localeCompare(b.date || "9999") || a.id.localeCompare(b.id));
}

// ---------------------------------------------------------------------
// Coordinates of places: saved with the page, then looked up on Wikidata
// for places that appeared in the graph since
// ---------------------------------------------------------------------
function applyCoordinates(coordinates) {
  for (const e of Object.values(entities)) {
    const c = e.type === "LOC" && e.wd ? coordinates[localName(e.wd)] : null;
    if (c) { e.lat = c[0]; e.lon = c[1]; }
  }
}

async function findMissingCoordinates() {
  let known = {};
  try { known = JSON.parse(localStorage.getItem("andric-coordinates") || "{}"); } catch (_) { /* storage unavailable */ }
  applyCoordinates(known);
  const missing = [...new Set(Object.values(entities)
    .filter((e) => e.type === "LOC" && e.wd && e.lat == null && !(localName(e.wd) in known)).map((e) => localName(e.wd)))];
  if (!missing.length) return;
  try {
    for (let i = 0; i < missing.length; i += 50) {
      const ids = missing.slice(i, i + 50);
      const response = await fetch(`https://www.wikidata.org/w/api.php?action=wbgetentities&ids=${ids.join("|")}&props=claims&format=json&origin=*`);
      const data = await response.json();
      for (const id of ids) {
        const v = data.entities?.[id]?.claims?.P625?.[0]?.mainsnak?.datavalue?.value;
        known[id] = v ? [v.latitude, v.longitude] : null;
      }
    }
    try { localStorage.setItem("andric-coordinates", JSON.stringify(known)); } catch (_) { /* storage unavailable */ }
    applyCoordinates(known);
    if (/^#\/(map|entity)/.test(location.hash)) route();
  } catch (_) { /* offline: the map shows the places it already knows */ }
}

// ---------------------------------------------------------------------
// Research questions: every query runs here, on the graph just read
// ---------------------------------------------------------------------
function answerQuestions() {
  const idByUri = new Map(letters.map((l) => [l.uri, l.id]));
  const cell = (b) => {
    if (!b) return null;
    if (b.type === "uri") {
      if (idByUri.has(b.value)) return { l: idByUri.get(b.value) };
      if (b.value.startsWith(config.base_uri + "entity/")) return { e: localName(b.value) };
      return { u: b.value };
    }
    return /#(integer|decimal|double|float|int|long|short|nonNegativeInteger)$/.test(b.datatype || "") ? Number(b.value) : b.value;
  };
  questions = BOOT.queries.map((q) => {
    try {
      const result = select(q.sparql);
      return { ...q, columns: result.vars, rows: result.rows.map((row) => result.vars.map((v) => cell(row[v]))) };
    } catch (e) {
      return { ...q, columns: [], rows: [], error: String(e.message || e) };
    }
  });
}

// ---------------------------------------------------------------------
// Turtle for one letter, written from the triples in the store
// ---------------------------------------------------------------------
function shortIri(iri) {
  for (const [prefix, ns] of NAMESPACES) {
    if (iri.startsWith(ns) && /^[\p{L}\p{N}_][\p{L}\p{N}_-]*$/u.test(iri.slice(ns.length))) return `${prefix}:${iri.slice(ns.length)}`;
  }
  return `<${iri}>`;
}

function termTurtle(term) {
  if (term.termType === "NamedNode") return shortIri(term.value);
  if (term.termType === "BlankNode") return `_:${term.value}`;
  const quoted = JSON.stringify(term.value);
  if (term.language) return `${quoted}@${term.language}`;
  const datatype = term.datatype ? term.datatype.value : "";
  return datatype && !datatype.endsWith("#string") ? `${quoted}^^${shortIri(datatype)}` : quoted;
}

function letterTurtle(l) {
  const byPredicate = new Map();
  for (const quad of store.match(OX.namedNode(l.uri), null, null, null)) {
    const p = quad.predicate.value;
    if (p === config.base_uri + "hasMention") continue;
    const object = p === "https://schema.org/text"
      ? { termType: "Literal", value: quad.object.value.slice(0, 80).replace(/\s+/g, " ") + " …", language: quad.object.language }
      : quad.object;
    const name = p.endsWith("ns#type") ? "a" : shortIri(p);
    if (!byPredicate.has(name)) byPredicate.set(name, []);
    byPredicate.get(name).push(termTurtle(object));
  }
  const body = `${shortIri(l.uri)}\n` + [...byPredicate].sort((a, b) => (a[0] === "a" ? -1 : b[0] === "a" ? 1 : a[0].localeCompare(b[0])))
    .map(([p, objects]) => `    ${p} ${objects.sort().join(",\n        ")}`).join(" ;\n") + " .";
  const used = NAMESPACES.filter(([prefix]) => body.includes(prefix + ":"));
  return used.map(([prefix, ns]) => `@prefix ${prefix}: <${ns}> .`).join("\n") + "\n\n" + body;
}

async function loadGraph() {
  OX = await import(OXIGRAPH_URL);
  await OX.default();
  const loaded = await readGraph();
  store = loaded.store;
  graphText = loaded.text;
  buildModel();
  applyCoordinates(BOOT.coordinates);
  indexModel();
  answerQuestions();
  meta = { ...config, triples: store.size, origin: loaded.origin };
  findMissingCoordinates();
}

// ---------------------------------------------------------------------
// Shared pieces
// ---------------------------------------------------------------------
// rows: [{ text, value, href, type }]
function barsHtml(rows, emptyText = "Nothing to show.") {
  if (!rows.length) return `<p class="muted">${emptyText}</p>`;
  const max = Math.max(...rows.map((r) => r.value));
  return `<div class="bars">${rows.map((r) => {
    const inner = `<span>${r.type ? dotOf(r.type) + " " : ""}${esc(r.text)}</span><i style="width:${Math.max(2, (r.value / max) * 100)}%"></i><b>${r.value}</b>`;
    return r.href ? `<a class="bar-row" href="${r.href}">${inner}</a>` : `<div class="bar-row">${inner}</div>`;
  }).join("")}</div>`;
}

function copyButton(root, selector, getText) {
  root.querySelectorAll(selector).forEach((btn) => btn.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(getText(btn)); btn.textContent = "Copied"; } catch (_) { btn.textContent = "Copy failed"; }
    setTimeout(() => { btn.textContent = btn.dataset.label; }, 1400);
  }));
}

// ---------------------------------------------------------------------
// Overview
// ---------------------------------------------------------------------
views.overview = (root) => {
  const recipients = liveEntities.filter((e) => e.received.length).sort((a, b) => b.received.length - a.received.length);
  const places = liveEntities.filter((e) => e.written.length).sort((a, b) => b.written.length - a.written.length);
  const people = liveEntities.filter((e) => e.type === "PER" && e.letters.length && e !== mainSender)
    .sort((a, b) => b.letters.length - a.letters.length || b.mentions - a.mentions);
  const linked = liveEntities.filter((e) => e.wd).length;
  const feature = letters.find((l) => l.flat.length > 450 && l.flat.length < 1100) || letters[0];
  const excerpt = feature.text.split("\n").slice(2).join("\n").trim();
  const stats = [
    [letters.length, "Letters"], [recipients.length, "Correspondents"], [`${YEAR_MIN}–${String(YEAR_MAX).slice(2)}`, "Years covered"],
    [places.length, "Places of writing"], [liveEntities.length, "People, places, works"], [`${Math.round((linked / liveEntities.length) * 100)}%`, "Linked to Wikidata"],
  ];

  root.innerHTML = `
    <section class="hero">

let lettersNewestFirst = false;

views.letters = (root) => {
  root.innerHTML = `
    <div class="page-head">
      <div><span class="eyebrow">The collection</span><h1>Letters</h1>
        <p>Search the full text, or narrow the collection by correspondent, place of writing, a person or place mentioned, and period.</p></div>
      <div class="seg" id="sort"><button data-v="0">Oldest first</button><button data-v="1">Newest first</button></div>
    </div>
    ${filterBarHtml()}
    <div class="letter-list" id="list"></div>`;
  let current = [];
  const draw = () => {
    const list = lettersNewestFirst ? [...current].reverse() : current;
    root.querySelectorAll("#sort button").forEach((b) => b.setAttribute("aria-pressed", String(Number(b.dataset.v) === Number(lettersNewestFirst))));
    root.querySelector("#list").innerHTML = list.length ? list.map((l, i) => `
      <a class="letter-row card${i < 12 ? " reveal" : ""}" style="--i:${i}" href="${hrefL(l.id)}">
        ${postmark(l)}
        <div>
          <h3>To ${esc(label(l.recipient) || "unknown recipient")}<small>${esc(l.id.replace("_", " ").toUpperCase())}</small></h3>
          <p>${snippet(l, filters.q)}</p>
          <div class="tally"><span>${esc(fmtDate(l.date))}${l.place ? " · " + esc(label(l.place)) : ""}</span>${typeTally(l)}</div>
        </div>
      </a>`).join("") : '<div class="empty">No letters match these filters.</div>';
  };
  bindFilterBar(root, (list) => { current = list; draw(); },
    '<button class="btn small" data-export="csv">Download CSV</button><button class="btn small" data-export="json">JSON</button>');
  root.querySelector("#sort").addEventListener("click", (e) => {

  root.addEventListener("click", (e) => {

views.letter = (root, [id]) => {
  const l = letterById.get(id);
  if (!l) { root.innerHTML = '<div class="empty">This letter does not exist. <a href="#/letters">Back to all letters</a></div>'; return; }
  const prev = letters[l.index - 1], next = letters[l.index + 1];

  let html = "", pos = 0;
  l.mentions.forEach((m, i) => {
    const e = entities[m.e];
    if (!e || m.s < pos) return;
    html += esc(l.text.slice(pos, m.s)) + `<span class="m t-${e.type}" data-i="${i}" tabindex="0">${esc(m.text)}</span>`;
    pos = m.t;
  });
  html += esc(l.text.slice(pos));

  const present = ["PER", "LOC", "ORG", "MISC", "DATE"].filter((t) => l.mentions.some((m) => entities[m.e]?.type === t));
  const groups = ENTITY_TYPES.map((t) => {
    const keys = [...l.keys].filter((k) => entities[k].type === t);
    const count = (k) => l.mentions.filter((m) => m.e === k).length;
    return keys.length ? `<h4>${TYPES[t].many}</h4><div class="chips">${keys.map((k) => entityChip(k, count(k) > 1 ? ` <small>×${count(k)}</small>` : "")).join("")}</div>` : "";
  }).join("");
  const models = {};
  for (const m of l.mentions) (models[m.m] = models[m.m] || []).push(m.c);
  const modelRows = Object.entries(models).map(([name, scores]) => {
    const real = scores.filter((c) => c != null && c < 1);
    return `<dd><span class="mono">${esc(name)}</span><br>${plural(scores.length, "mention")}${real.length ? `, mean confidence ${Math.round((real.reduce((a, b) => a + b, 0) / real.length) * 100)}%` : ""}</dd>`;
  }).join("<dt></dt>");

  root.innerHTML = `
    <div class="crumbs">
      <a href="#/letters">Letters</a><span>/</span><span>${esc(l.id)}</span><span class="spacer"></span>
      <span class="mono">${l.index + 1} / ${letters.length}</span>
      ${prev ? `<a class="btn small" href="${hrefL(prev.id)}">← ${esc(fmtDate(prev.date, true))}</a>` : ""}
      ${next ? `<a class="btn small" href="${hrefL(next.id)}">${esc(fmtDate(next.date, true))} →</a>` : ""}
    </div>
    <div class="letter-layout">
      <article class="sheet card reveal">
        <header class="sheet-head">
          ${postmark(l, 104)}
          <div><span class="eyebrow">${esc(fmtDate(l.date))}${l.place ? " · " + esc(label(l.place)) : ""}</span>
            <h1>${esc(label(l.sender))} to ${esc(label(l.recipient) || "unknown recipient")}</h1>
            <p>${entityChip(l.sender)} → ${entityChip(l.recipient)} ${l.place ? entityChip(l.place) : ""}</p></div>
        </header>
        <div class="sheet-tools">
          <span class="eyebrow">Highlight</span>
          <div class="seg" id="hl">${present.map((t) => `<button data-t="${t}" aria-pressed="true">${dotOf(t)}${TYPES[t].many}</button>`).join("")}</div>
        </div>
        <div class="letter-text" id="text" lang="sr">${html}</div>
      </article>
      <aside class="side">
        <div class="panel card reveal" style="--i:1"><h2>In this letter</h2>${groups || '<p class="muted">No entities were recognised.</p>'}</div>
        <div class="panel card reveal" style="--i:2"><h2>Provenance</h2>
          <dl class="facts">
            <dt>Edition</dt><dd>${esc(meta.source_label || "—")}</dd>
            <dt>Transcript</dt><dd><span class="mono">${esc(l.source || "—")}</span><br>Transkribus PAGE XML${l.pages ? `, page image ${esc(l.pages.replace(/;/g, "–"))}` : ""}</dd>
            <dt>Identifier</dt><dd><span class="mono">${esc(l.uri)}</span></dd>
            <dt>Entities</dt>${modelRows || "<dd>—</dd>"}
          </dl>
          <p class="muted" style="font-size:12.5px;margin:12px 0 0">Dates, places and names are extracted automatically; compare with the source text before quoting.</p>
          <details class="code"><summary>RDF description (Turtle)</summary>
            <pre class="code" id="ttl">${esc(letterTurtle(l))}</pre>
            <p style="margin:10px 0 0;display:flex;gap:8px;flex-wrap:wrap"><button class="btn small" data-copy data-label="Copy Turtle">Copy Turtle</button>
              <button class="btn small" data-graph-download>Whole graph (.ttl)</button></p>
          </details>
        </div>
      </aside>
    </div>`;

  const text = root.querySelector("#text");
  root.querySelector("#hl").addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    const on = btn.getAttribute("aria-pressed") !== "true";
    btn.setAttribute("aria-pressed", String(on));
    text.querySelectorAll(`.m.t-${btn.dataset.t}`).forEach((el) => el.classList.toggle("off", !on));
  });
  const describe = (el) => {
    const m = l.mentions[Number(el.dataset.i)], e = entities[m.e];
    return `<b>${esc(e.label)}</b>${TYPES[e.type].one}${m.text !== e.label ? ` · written “${esc(m.text)}”` : ""}`
      + `<br><small>${esc(m.m)}${m.c != null && m.c < 1 ? ` · ${Math.round(m.c * 100)}%` : ""}</small>`;
  };
  text.addEventListener("mousemove", (e) => {
    const el = e.target.closest(".m:not(.off)");
    if (el) tip.show(describe(el), e); else tip.hide();
  });
  text.addEventListener("mouseleave", tip.hide);
  const open = (el) => {
    const e = entities[l.mentions[Number(el.dataset.i)].e];
    if (e.type !== "DATE") location.hash = hrefE(e.key);
  };
  text.addEventListener("click", (e) => { const el = e.target.closest(".m:not(.off)"); if (el) open(el); });
  text.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.classList.contains("m")) open(e.target); });
  copyButton(root, "[data-copy]", () => root.querySelector("#ttl").textContent);
};

views.entity = (root, [key]) => {
  const e = entities[key];
  if (!e) { root.innerHTML = '<div class="empty">This entry does not exist. <a href="#/entities">Back to the index</a></div>'; return; }
  const involved = letters.filter((l) => l.keys.has(key) || l.recipient === key || l.place === key || l.sender === key);
  const mentioned = e.letters;
  const together = new Map();
  for (const l of mentioned) for (const k of l.keys) if (k !== key && entities[k].type !== "DATE") together.set(k, (together.get(k) || 0) + 1);
  const forms = [...e.forms].sort((a, b) => b[1] - a[1]);
  const perYear = new Map();
  for (const l of involved) if (l.year) perYear.set(l.year, (perYear.get(l.year) || 0) + 1);
  const roles = [
    e.received.length && `addressee of ${plural(e.received.length, "letter")}`,
    e.sent.length && `author of ${plural(e.sent.length, "letter")}`,
    e.written.length && `place of writing of ${plural(e.written.length, "letter")}`,
    mentioned.length && `mentioned in ${plural(mentioned.length, "letter")}`,
  ].filter(Boolean);

  const context = (l) => {
    const m = l.mentions.find((x) => x.e === key);
    const role = [l.recipient === key && "addressee", l.sender === key && "author", l.place === key && "written here",
      m && plural(l.mentions.filter((x) => x.e === key).length, "mention")].filter(Boolean).join(" · ");
    const clean = (s) => esc(s.replace(/\s+/g, " "));
    const body = m ? `${m.s > 80 ? "…" : ""}${clean(l.text.slice(Math.max(0, m.s - 80), m.s))}<mark>${esc(m.text)}</mark>${clean(l.text.slice(m.t, m.t + 110))}…` : snippet(l, "", 170);
    return `<a class="card" href="${hrefL(l.id)}"><time>${esc(fmtDate(l.date, true))}</time><div><p>${body}</p><small>To ${esc(label(l.recipient))} · ${role}</small></div></a>`;
  };

  root.innerHTML = `
    <div class="crumbs"><a href="#/entities/${e.type}">${TYPES[e.type].many}</a><span>/</span><span>${esc(e.label)}</span></div>
    <header class="profile-head reveal">
      <div><span class="chip">${dotOf(e.type)}${TYPES[e.type].one}</span>
        <h1>${esc(e.label)}</h1>
        <p class="muted" style="margin:10px 0 0">${roles.join(" · ") || "Not connected to any letter."}</p></div>
      <div class="hero-actions">
        ${e.wd ? `<a class="btn" href="${esc(e.wd)}" target="_blank" rel="noopener">Wikidata ${esc(e.wd.split("/").pop())} ↗</a>` : '<span class="chip">No Wikidata link</span>'}
        <button class="btn primary" id="as-filter">Show ${involved.length === 1 ? "the letter" : `all ${involved.length} letters`}</button>
      </div>
    </header>
    <div class="profile-grid">
      <section><div class="section-title"><h2>In the letters</h2></div>
        <div class="kwic">${involved.map(context).join("") || '<div class="empty">No letters.</div>'}</div></section>
      <aside class="side">
        ${e.lat != null ? `<div class="panel card"><h2>On the map</h2><div class="mini-map" id="mini-map"></div></div>` : ""}
        <div class="panel card"><h2>Over time</h2>${barsHtml([...perYear].sort((a, b) => a[0] - b[0]).map(([y, n]) => ({ text: String(y), value: n })))}</div>
        ${forms.length ? `<div class="panel card"><h2>As written</h2><p class="muted" style="margin:-6px 0 10px;font-size:13px">Forms found in the text and normalised to “${esc(e.label)}”.</p>
          <div class="chips">${forms.map(([f, n]) => `<span class="chip">${esc(f)} <small>×${n}</small></span>`).join("")}</div></div>` : ""}
        ${together.size ? `<div class="panel card"><h2>Appears with</h2><div class="chips">${[...together].sort((a, b) => b[1] - a[1] || label(a[0]).localeCompare(label(b[0]))).slice(0, 18)
          .map(([k, n]) => entityChip(k, n > 1 ? ` <small>×${n}</small>` : "")).join("")}</div></div>` : ""}
        <div class="panel card"><h2>Identifier</h2><p class="mono" style="margin:0;overflow-wrap:anywhere">${esc(meta.base_uri)}entity/${esc(key)}</p></div>
      </aside>
    </div>`;

  root.querySelector("#as-filter").addEventListener("click", () => {
    resetFilters();
    filters.entities = [key];
    location.hash = "#/letters";
  });
  if (e.lat != null && window.L) {
    const map = L.map("mini-map", { zoomControl: false, attributionControl: false, scrollWheelZoom: false }).setView([e.lat, e.lon], 5);
    L.tileLayer(TILE_URL, { maxZoom: 12 }).addTo(map);
    L.circleMarker([e.lat, e.lon], { radius: 8, color: cssVar("--surface"), weight: 2, fillColor: cssVar("--loc"), fillOpacity: 1 }).addTo(map);
    return () => map.remove();
  }
};

// ---------------------------------------------------------------------
// Research questions (SPARQL queries run when the app is built)
// ---------------------------------------------------------------------
function cellText(v) {
  if (v == null) return "";
  if (typeof v !== "object") return v;
  if (v.e) return label(v.e) || v.e;
  if (v.l) return v.l;
  return v.u;
}
function cellHtml(v) {
  if (v == null || v === "") return '<span class="muted">—</span>';
  if (typeof v === "object") {
    if (v.e) return entities[v.e] ? entityChip(v.e) : esc(v.e);
    if (v.l) { const l = letterById.get(v.l); return `<a href="${hrefL(v.l)}">${l ? "Letter of " + esc(fmtDate(l.date, true)) : esc(v.l)}</a>`; }
    return `<a href="${esc(v.u)}" target="_blank" rel="noopener">${esc(v.u.replace(/^https?:\/\//, ""))}</a>`;
  }
  if (typeof v === "number") return v.toLocaleString("en");
  if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return esc(fmtDate(v, true));
  if (TYPES[v]) return `<span class="chip">${dotOf(v)}${TYPES[v].one}</span>`;
  return esc(v);
}

views.questions = (root, [idArg]) => {
  const q = questions.find((x) => x.id === idArg) || questions[0];
  if (!q) { root.innerHTML = '<div class="empty">No research questions are defined.</div>'; return; }
  const heading = (c) => c.replace(/_/g, " ");
  const numeric = q.columns.map((_, i) => q.rows.length > 0 && q.rows.every((r) => typeof r[i] === "number"));
  let sort = { col: -1, dir: 1 };

  const chartIdx = q.chart.length === 2 ? q.chart.map((c) => q.columns.indexOf(c)) : [];
  const chart = chartIdx.length === 2 && chartIdx.every((i) => i >= 0) ? barsHtml(q.rows.slice(0, 12).map((r) => {
    const v = r[chartIdx[0]];
    return { text: TYPES[v] ? TYPES[v].many : cellText(v), value: r[chartIdx[1]], href: v && v.e ? hrefE(v.e) : "", type: v && v.e ? entities[v.e]?.type : (TYPES[v] ? v : "") };
  })) : "";

  root.innerHTML = `
    <div class="page-head"><div><span class="eyebrow">Predefined SPARQL queries</span><h1>Research questions</h1>
      <p>Each question is a query over the graph. The answer, the query itself and the data are all open — follow any name or letter to check it against the source.</p></div></div>
    <div class="q-layout">
      <nav class="q-list" aria-label="Questions">${questions.map((x) => `<a href="#/questions/${x.id}"${x === q ? ' aria-current="true"' : ""}><span>${esc(x.title)}</span></a>`).join("")}</nav>
      <article class="q-body card reveal">
        <h1>${esc(q.title)}</h1>
        <p>${esc(q.description)}</p>
        ${q.error ? `<div class="empty">This query could not be run on the current graph: ${esc(q.error)}</div>` : ""}
        ${chart ? `<div style="max-width:620px;margin:20px 0 8px">${chart}${q.rows.length > 12 ? `<p class="muted" style="font-size:12.5px">First 12 of ${q.rows.length} rows.</p>` : ""}</div>` : ""}
        <div class="viz-tools" style="margin:18px 0 0"><span class="eyebrow">${plural(q.rows.length, "row")}</span><span class="spacer"></span>
          <button class="btn small" id="q-csv">Download CSV</button></div>
        <div class="table-wrap"><table class="data"><thead><tr>${q.columns.map((c, i) => `<th data-col="${i}" scope="col">${esc(heading(c))}</th>`).join("")}</tr></thead><tbody id="q-rows"></tbody></table></div>
        <details class="code"><summary>How this is answered — the SPARQL query</summary>
          <pre class="code" id="q-sparql">${esc(q.sparql)}</pre>
          <p style="margin:10px 0 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn small" data-copy data-label="Copy query">Copy query</button>
            <span class="mono muted">${esc(q.file)}</span></p>
        </details>
      </article>
    </div>`;

  const drawRows = () => {
    const rows = [...q.rows];
    if (sort.col >= 0) rows.sort((a, b) => {
      const x = cellText(a[sort.col]), y = cellText(b[sort.col]);
      return (typeof x === "number" && typeof y === "number" ? x - y : String(x).localeCompare(String(y))) * sort.dir;
    });
    root.querySelector("#q-rows").innerHTML = rows.map((r) => `<tr>${r.map((v, i) => `<td${numeric[i] ? ' class="num"' : ""}>${cellHtml(v)}</td>`).join("")}</tr>`).join("");
    root.querySelectorAll("th").forEach((th) => {
      if (Number(th.dataset.col) === sort.col) th.setAttribute("aria-sort", sort.dir > 0 ? "ascending" : "descending"); else th.removeAttribute("aria-sort");
    });
  };
  root.querySelector("thead").addEventListener("click", (e) => {
    const th = e.target.closest("th");
    if (!th) return;
    const col = Number(th.dataset.col);
    sort = { col, dir: sort.col === col ? -sort.dir : 1 };
    drawRows();
  });
  root.querySelector("#q-csv").addEventListener("click", () => download(`${q.id}.csv`,
    "\ufeff" + [q.columns.join(","), ...q.rows.map((r) => r.map((v) => csvCell(cellText(v))).join(","))].join("\n"), "text/csv"));
  copyButton(root, "[data-copy]", () => q.sparql);
  drawRows();
};

// ---------------------------------------------------------------------
// Timeline: letters per year and one lane per correspondent or place
// ---------------------------------------------------------------------
let timelineLanes = "recipient";

views.timeline = (root) => {
  root.innerHTML = `
    <div class="page-head"><div><span class="eyebrow">Chronology</span><h1>Timeline</h1>
      <p>Every letter placed on its date. Empty stretches are periods not yet covered by the transcribed selection.</p></div></div>
    ${filterBarHtml()}
    <div class="viz card">
      <div class="viz-tools"><span class="eyebrow">Lanes</span>
        <div class="seg" id="lanes"><button data-v="recipient">By correspondent</button><button data-v="place">By place of writing</button></div>
        <span class="spacer"></span><span class="muted" style="font-size:12.5px">Each mark is one letter — hover to preview, click to open.</span></div>
      <div id="timeline"></div>
    </div>`;
  const box = root.querySelector("#timeline");
  let current = [];

  const draw = () => {
    root.querySelectorAll("#lanes button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === timelineLanes)));
    const dated = current.filter((l) => l.date);
    if (!dated.length) { box.innerHTML = '<div class="empty">No dated letters match these filters.</div>'; return; }
    const width = Math.max(520, box.clientWidth), left = width < 760 ? 118 : 178, right = 22, histH = 96, top = 30, R = 6;
    const x = d3.scaleTime().domain([new Date(YEAR_MIN, 0, 1), new Date(YEAR_MAX + 1, 0, 1)]).range([left, width - right]);
    const perYear = d3.rollup(dated, (v) => v.length, (l) => l.year);
    const yMax = Math.max(...perYear.values());
    const yH = d3.scaleLinear().domain([0, yMax]).range([0, histH - 8]);

    const groups = d3.groups(dated, (l) => l[timelineLanes] || "").sort((a, b) => b[1].length - a[1].length || label(a[0]).localeCompare(label(b[0])));
    let y = top + histH + 44;
    const lanes = groups.map(([key, list]) => {
      const ends = [];
      const dots = list.map((l) => {
        const cx = x(new Date(l.date));
        let level = ends.findIndex((end) => cx - end >= 2 * R + 2);
        if (level < 0) level = ends.length;
        ends[level] = cx;
        return { l, cx, level };
      });
      const lane = { key, dots, y, h: 34 + (ends.length - 1) * (2 * R + 2) };
      y += lane.h + 14;
      return lane;
    });
    const height = y + 8;
    const step = Math.ceil((YEAR_MAX - YEAR_MIN + 1) / Math.max(2, Math.floor((width - left - right) / 46)));
    const ticks = d3.range(YEAR_MIN, YEAR_MAX + 1).filter((yr) => (yr - YEAR_MIN) % step === 0);
    const baseY = top + histH;
    const barW = Math.min(24, Math.max(3, x(new Date(YEAR_MIN + 1, 0, 1)) - x(new Date(YEAR_MIN, 0, 1)) - 2));
    const bar = (yr, n) => {
      const h = yH(n), bx = (x(new Date(yr, 0, 1)) + x(new Date(yr + 1, 0, 1))) / 2 - barW / 2, r = Math.min(4, barW / 2, h);
      return `<path class="t-bar" data-year="${yr}" data-n="${n}" d="M${bx},${baseY}V${baseY - h + r}Q${bx},${baseY - h} ${bx + r},${baseY - h}H${bx + barW - r}Q${bx + barW},${baseY - h} ${bx + barW},${baseY - h + r}V${baseY}Z"/>`;
    };
    const short = (s) => (s.length > 22 ? s.slice(0, 21) + "…" : s);

    box.innerHTML = `<svg viewBox="0 0 ${width} ${height}" height="${height}" role="img" aria-label="Timeline of ${dated.length} letters">
      <text class="lane-label" x="0" y="${top - 12}" style="font:500 11px var(--mono);letter-spacing:.12em;fill:var(--muted)">LETTERS PER YEAR</text>
      <g class="axis">
        ${ticks.map((yr) => `<line class="grid-line" x1="${x(new Date(yr, 0, 1))}" x2="${x(new Date(yr, 0, 1))}" y1="${baseY}" y2="${height - 6}"/>
          <text x="${x(new Date(yr, 0, 1))}" y="${baseY + 17}" text-anchor="middle">${yr}</text>`).join("")}
        <line x1="${left}" x2="${width - right}" y1="${baseY}" y2="${baseY}"/>
        <text x="${left - 10}" y="${baseY - yH(yMax) + 4}" text-anchor="end">${yMax}</text>
      </g>
      ${[...perYear].map(([yr, n]) => bar(yr, n)).join("")}
      ${lanes.map((lane) => `
        <text class="lane-label" x="0" y="${lane.y + lane.h / 2 + 4}">${esc(short(label(lane.key) || "Unknown"))}<tspan style="fill:var(--muted);font:11px var(--mono)" dx="6">${lane.dots.length}</tspan></text>
        <line class="grid-line" x1="${left}" x2="${width - right}" y1="${lane.y + lane.h - 6}" y2="${lane.y + lane.h - 6}"/>
        ${lane.dots.map((d) => `<circle class="t-dot" tabindex="0" data-id="${esc(d.l.id)}" cx="${d.cx}" cy="${lane.y + lane.h - 6 - R - 2 - d.level * (2 * R + 2)}" r="${R}"/>`).join("")}`).join("")}
    </svg>`;
  };

  bindFilterBar(root, (list) => { current = list; draw(); });
  root.querySelector("#lanes").addEventListener("click", (e) => { if (e.target.dataset.v) { timelineLanes = e.target.dataset.v; draw(); } });
  box.addEventListener("mousemove", (e) => {
    const t = e.target;
    if (t.classList.contains("t-dot")) {
      const l = letterById.get(t.dataset.id);
      tip.show(`<b>${esc(fmtDate(l.date))}</b>To ${esc(label(l.recipient))}${l.place ? " · " + esc(label(l.place)) : ""}<br><small>${esc(l.flat.slice(0, 90))}…</small>`, e);
    } else if (t.classList.contains("t-bar")) {
      tip.show(`<b>${t.dataset.year}</b>${plural(Number(t.dataset.n), "letter")}`, e);
    } else tip.hide();
  });
  box.addEventListener("mouseleave", tip.hide);
  box.addEventListener("click", (e) => { if (e.target.dataset.id) location.hash = hrefL(e.target.dataset.id); });
  box.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.dataset.id) location.hash = hrefL(e.target.dataset.id); });
  const observer = new ResizeObserver(draw);
  observer.observe(box);
  return () => observer.disconnect();
};

// ---------------------------------------------------------------------
// Map: places of writing, places mentioned, and the itinerary between them
// ---------------------------------------------------------------------
const TILE_URL = "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png";
const mapLayers = { written: true, mentioned: true, route: true };

views.map = (root) => {
  root.innerHTML = `
    <div class="page-head"><div><span class="eyebrow">Geography</span><h1>Map</h1>
      <p>Where the letters were written, which places they talk about, and the route between successive places of writing.</p></div></div>
    ${filterBarHtml()}
    <div class="viz card">
      <div class="viz-tools">
        <div class="seg" id="layers">
          <button data-k="written"><span class="dot" style="--c:var(--accent)"></span>Written from</button>
          <button data-k="mentioned"><span class="dot" style="background:none;border:2px solid var(--loc)"></span>Mentioned</button>
          <button data-k="route"><span style="width:16px;border-top:2px dashed var(--stamp)"></span>Itinerary</button>
        </div>
        <span class="spacer"></span><span class="muted" id="map-note" style="font-size:12.5px"></span>
      </div>
      <div id="map"></div>
    </div>`;
  if (!window.L) { root.querySelector("#map").innerHTML = '<div class="empty">The map library could not be loaded.</div>'; return; }

  const map = L.map("map", { worldCopyJump: true }).setView([45, 14], 5);
  L.tileLayer(TILE_URL, {
    maxZoom: 12,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  }).addTo(map);
  const layer = L.layerGroup().addTo(map);
  let current = [];
  const push = (m, k, l) => { if (!m.has(k)) m.set(k, []); m.get(k).push(l); };
  const popup = (key, written, mentioned) => `<h3>${esc(label(key))}</h3>
    <div class="scroll">${written.length ? `<span class="eyebrow">Written here</span>${written.map((l) => `<a href="${hrefL(l.id)}">${esc(fmtDate(l.date, true))} · to ${esc(label(l.recipient))}</a>`).join("")}` : ""}
    ${mentioned.length ? `<span class="eyebrow" style="display:block;margin-top:8px">Mentioned in</span>${mentioned.map((l) => `<a href="${hrefL(l.id)}">${esc(fmtDate(l.date, true))} · to ${esc(label(l.recipient))}</a>`).join("")}` : ""}</div>
    <a href="${hrefE(key)}" style="margin-top:8px;font-weight:500">Open profile →</a>`;

  const draw = (fit) => {
    layer.clearLayers();
    root.querySelectorAll("#layers button").forEach((b) => b.setAttribute("aria-pressed", String(mapLayers[b.dataset.k])));
    const written = new Map(), mentioned = new Map(), points = [], path = [];
    let unplaced = 0;
    for (const l of current) {
      const p = entities[l.place];
      if (p && p.lat != null) {
        push(written, l.place, l);
        if (!path.length || path[path.length - 1].key !== l.place) path.push(p);
      } else unplaced++;
      for (const k of l.keys) if (entities[k].type === "LOC" && entities[k].lat != null && k !== l.place) push(mentioned, k, l);
    }
    if (mapLayers.route && path.length > 1) L.polyline(path.map((p) => [p.lat, p.lon]), { className: "mk-route", interactive: false }).addTo(layer);
    if (mapLayers.mentioned) for (const [k, list] of mentioned) {
      if (mapLayers.written && written.has(k)) continue;
      const e = entities[k];
      L.circleMarker([e.lat, e.lon], { radius: 5 + Math.sqrt(list.length) * 2, className: "mk-mentioned" })
        .bindPopup(popup(k, [], list)).bindTooltip(`${e.label} · mentioned in ${plural(list.length, "letter")}`).addTo(layer);
      points.push([e.lat, e.lon]);
    }
    if (mapLayers.written) for (const [k, list] of written) {
      const e = entities[k];
      L.circleMarker([e.lat, e.lon], { radius: 7 + Math.sqrt(list.length) * 3, className: "mk-written" })
        .bindPopup(popup(k, list, mentioned.get(k) || [])).bindTooltip(`${e.label} · ${plural(list.length, "letter")} written here`).addTo(layer);
      points.push([e.lat, e.lon]);
    }
    root.querySelector("#map-note").textContent = unplaced ? `${plural(unplaced, "letter")} not shown: place of writing unknown or not located.` : "";
    if (fit && points.length) map.fitBounds(points, { padding: [50, 50], maxZoom: 7 });
  };

  bindFilterBar(root, (list) => { current = list; draw(true); });
  root.querySelector("#layers").addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    mapLayers[btn.dataset.k] = !mapLayers[btn.dataset.k];
    draw(false);
  });
  setTimeout(() => map.invalidateSize(), 60);
  return () => map.remove();
};

// ---------------------------------------------------------------------
// Network: letters and the entities they mention, or entities that co-occur
// ---------------------------------------------------------------------
const networkState = { mode: "bipartite", types: new Set(ENTITY_TYPES) };

views.network = (root) => {
  root.innerHTML = `
    <div class="page-head"><div><span class="eyebrow">Connections</span><h1>Network</h1>
      <p>Letters linked to what they mention — or, without the letters, names that occur together. Larger nodes have more connections.</p></div></div>
    ${filterBarHtml()}
    <div class="viz card">
      <div class="viz-tools">
        <div class="seg" id="mode"><button data-m="bipartite">Letters &amp; names</button><button data-m="co">Names only</button></div>
        <div class="seg" id="types">${ENTITY_TYPES.map((t) => `<button data-t="${t}">${dotOf(t)}${TYPES[t].many}</button>`).join("")}</div>
        <span class="spacer"></span>
        <div class="legend"><span><span class="dot sq"></span>Letter</span><span class="muted">Drag nodes · scroll to zoom · click to open</span></div>
      </div>
      <svg id="network" role="img" aria-label="Network of letters and the names they mention"></svg>
    </div>`;
  const svgEl = root.querySelector("#network");
  let current = [], sim = null;

  const draw = () => {
    root.querySelectorAll("#mode button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.m === networkState.mode)));
    root.querySelectorAll("#types button").forEach((b) => b.setAttribute("aria-pressed", String(networkState.types.has(b.dataset.t))));
    if (sim) sim.stop();
    if (!window.d3) return;
    const svg = d3.select(svgEl);
    svg.selectAll("*").remove();
    const width = svgEl.clientWidth || 900, height = svgEl.clientHeight || 600;
    const nodes = new Map(), linkMap = new Map();
    const node = (id, props) => { if (!nodes.has(id)) nodes.set(id, { id, degree: 0, ...props }); return nodes.get(id); };
    const link = (a, b) => { const k = a < b ? `${a}|${b}` : `${b}|${a}`; linkMap.set(k, { source: a, target: b, weight: (linkMap.get(k)?.weight || 0) + 1 }); };
    for (const l of current) {
      const keys = [...l.keys].filter((k) => networkState.types.has(entities[k].type));
      if (networkState.mode === "bipartite") {
        node("L:" + l.id, { kind: "LETTER", text: `${fmtDate(l.date, true)}`, href: hrefL(l.id), sub: `Letter to ${label(l.recipient)}` });
        for (const k of keys) { node(k, { kind: entities[k].type, text: entities[k].label, href: hrefE(k) }); link("L:" + l.id, k); }
      } else {
        for (const k of keys) node(k, { kind: entities[k].type, text: entities[k].label, href: hrefE(k) });
        for (let i = 0; i < keys.length; i++) for (let j = i + 1; j < keys.length; j++) link(keys[i], keys[j]);
      }
    }
    const links = [...linkMap.values()];
    for (const l of links) { nodes.get(l.source).degree++; nodes.get(l.target).degree++; }
    const list = [...nodes.values()];
    if (!list.length) { svg.append("text").attr("x", width / 2).attr("y", height / 2).attr("text-anchor", "middle").attr("fill", "var(--muted)").text("Nothing to draw for these filters."); return; }
    for (const n of list) n.r = n.kind === "LETTER" ? 5.5 : 5 + Math.sqrt(n.degree) * 2.4;
    const labelMin = list.length > 60 ? 3 : 2;
    const neighbours = new Map(list.map((n) => [n.id, new Set([n.id])]));
    for (const l of links) { neighbours.get(l.source).add(l.target); neighbours.get(l.target).add(l.source); }

    const stage = svg.append("g");
    const linkSel = stage.append("g").selectAll("line").data(links).join("line").attr("class", "link").attr("stroke-width", (d) => Math.min(4, 0.6 + d.weight * 0.6));
    const shape = (d) => d3.symbol().type(d.kind === "LETTER" ? d3.symbolSquare : d.kind === "MISC" ? d3.symbolDiamond : d3.symbolCircle).size(Math.PI * d.r * d.r)();
    const nodeSel = stage.append("g").selectAll("g").data(list).join("g")
      .attr("class", (d) => `node t-${d.kind}${d.kind !== "LETTER" && d.degree >= labelMin ? " lbl" : ""}`).attr("tabindex", 0);
    nodeSel.append("path").attr("d", shape);
    nodeSel.append("text").attr("x", (d) => d.r + 4).attr("y", 4).text((d) => (d.text.length > 26 ? d.text.slice(0, 25) + "…" : d.text));

    let moved = false;
    nodeSel.on("mousemove", (e, d) => {
      tip.show(`<b>${esc(d.text)}</b>${d.kind === "LETTER" ? esc(d.sub) : TYPES[d.kind].one}<br><small>${plural(d.degree, "connection")}</small>`, e);
      const near = neighbours.get(d.id);
      nodeSel.classed("dim", (n) => !near.has(n.id)).classed("hot", (n) => near.has(n.id));
      linkSel.classed("dim", (l) => l.source.id !== d.id && l.target.id !== d.id);
    }).on("mouseleave", () => { tip.hide(); nodeSel.classed("dim", false).classed("hot", false); linkSel.classed("dim", false); })
      .on("click", (e, d) => { if (!moved) location.hash = d.href; })
      .on("keydown", (e, d) => { if (e.key === "Enter") location.hash = d.href; });

    sim = d3.forceSimulation(list)
      .force("link", d3.forceLink(links).id((d) => d.id).distance(networkState.mode === "co" ? 74 : 52).strength(0.45))
      .force("charge", d3.forceManyBody().strength(-170))
      .force("collide", d3.forceCollide((d) => d.r + 5))
      .force("x", d3.forceX(width / 2).strength(0.06)).force("y", d3.forceY(height / 2).strength(0.08))
      .stop();
    for (let i = 0; i < 160; i++) sim.tick();
    const place = () => {
      linkSel.attr("x1", (d) => d.source.x).attr("y1", (d) => d.source.y).attr("x2", (d) => d.target.x).attr("y2", (d) => d.target.y);
      nodeSel.attr("transform", (d) => `translate(${d.x},${d.y})`);
    };
    place();
    sim.on("tick", place);
    nodeSel.call(d3.drag()
      .on("start", (e, d) => { moved = false; if (!e.active) sim.alphaTarget(0.25).restart(); d.fx = d.x; d.fy = d.y; })
      .on("drag", (e, d) => { moved = true; d.fx = e.x; d.fy = e.y; })
      .on("end", (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));
    const zoom = d3.zoom().scaleExtent([0.35, 4]).on("zoom", (e) => stage.attr("transform", e.transform));
    svg.call(zoom);
    const xs = d3.extent(list, (d) => d.x), ys = d3.extent(list, (d) => d.y);
    const k = Math.min(1.25, 0.9 / Math.max((xs[1] - xs[0] + 160) / width, (ys[1] - ys[0] + 60) / height));
    svg.call(zoom.transform, d3.zoomIdentity.translate(width / 2, height / 2).scale(k).translate(-(xs[0] + xs[1]) / 2, -(ys[0] + ys[1]) / 2));
  };

  bindFilterBar(root, (list) => { current = list; draw(); });
  root.querySelector("#mode").addEventListener("click", (e) => { if (e.target.dataset.m) { networkState.mode = e.target.dataset.m; draw(); } });
  root.querySelector("#types").addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    const t = btn.dataset.t;
    if (networkState.types.has(t)) networkState.types.delete(t); else networkState.types.add(t);
    draw();
  });
  return () => { if (sim) sim.stop(); };
};

boot();
</script>
